name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server_base_server
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'

      - name: Workspace pub get
        run: flutter pub get
        working-directory: ./

      - name: Install Serverpod CLI
        run: |
          dart pub global activate serverpod_cli 4.0.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Generate
        run: serverpod generate

      - name: Fail on stale generated code
        run: git diff --exit-code -- . ':!pubspec.lock'
        working-directory: ./

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test (embedded Postgres via test config)
        run: dart test --chain-stack-traces --verbose-trace -r expanded --file-reporter=json:/tmp/test-results.json --concurrency=1

      - name: Dump diagnostics on failure
        if: failure()
        working-directory: ./
        run: |
          echo "----- free -h -----"
          free -h || true
          echo "----- dmesg (OOM check) -----"
          sudo dmesg 2>/dev/null | grep -i "killed process\|out of memory\|oom" || echo "(no dmesg access or no OOM entries)"
          echo "----- hooks_runner logs -----"
          for f in $(find .dart_tool/hooks_runner -type f \( -name stdout.txt -o -name stderr.txt \) 2>/dev/null); do
            echo "===== $f ====="
            cat "$f"
          done
          echo "----- core files -----"
          find /home/runner/work -maxdepth 5 -iname "core*" 2>/dev/null || true
          echo "----- json test-results (if any) -----"
          cat /tmp/test-results.json 2>/dev/null || echo "(none written)"

  flutter:
    runs-on: ubuntu-latest
    needs: server
    defaults:
      run:
        working-directory: server_base_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'

      - name: Workspace pub get
        run: flutter pub get
        working-directory: ./

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos
