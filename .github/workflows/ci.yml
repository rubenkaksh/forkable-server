name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server_base_server
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'

      - name: Workspace pub get
        run: flutter pub get
        working-directory: ./

      - name: Install Serverpod CLI
        run: |
          dart pub global activate serverpod_cli 4.0.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Generate
        run: serverpod generate

      - name: Fail on stale generated code
        run: git diff --exit-code -- . ':!pubspec.lock'
        working-directory: ./

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test (embedded Postgres via test config)
        run: dart test --chain-stack-traces --verbose-trace 2>&1 | tee /tmp/dart_test_output.log; exit ${PIPESTATUS[0]}
        shell: bash

  flutter:
    runs-on: ubuntu-latest
    needs: server
    defaults:
      run:
        working-directory: server_base_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'

      - name: Workspace pub get
        run: flutter pub get
        working-directory: ./

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos
